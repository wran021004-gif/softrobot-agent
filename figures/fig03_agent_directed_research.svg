<text x="84" y="512" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#26384B" text-anchor="start">T04  |  TRAJECTORY INITIALIZATION</text>
<text x="84" y="538" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#70849A" text-anchor="start">Task-conditioned mathematical research</text>
<rect x="82" y="560" width="496" height="78" fill="#FFFFFF" stroke="#C9D1D7" stroke-width="1.6"/><text x="98" y="584" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#A35D55" text-anchor="start">OBSERVATION</text><text x="98" y="609" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#26384B" text-anchor="start">Inadmissible all-4 N reference initialization</text>
<line x1="330" y1="638" x2="330" y2="656" stroke="#70849A" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="82" y="656" width="496" height="78" fill="#FFFFFF" stroke="#C9D1D7" stroke-width="1.6"/><text x="98" y="680" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#B08A59" text-anchor="start">HYPOTHESIS</text><text x="98" y="705" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#26384B" text-anchor="start">Boundary initialization is inconsistent</text><text x="98" y="732" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">with the time-zero equilibrium.</text>
<line x1="330" y1="734" x2="330" y2="752" stroke="#70849A" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="82" y="752" width="496" height="104" fill="#FFFFFF" stroke="#C9D1D7" stroke-width="1.6"/><text x="98" y="776" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#527F7B" text-anchor="start">INVESTIGATION</text><text x="98" y="801" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#26384B" text-anchor="start">Rebuild an equilibrium-consistent reference</text><text x="98" y="828" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">Restart at t=0; shift boundary tension 0.20 → 0.21 N;</text><text x="98" y="851" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">construct an 89-point equilibrium bank.</text>
<line x1="330" y1="856" x2="330" y2="874" stroke="#70849A" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="82" y="874" width="496" height="66" fill="#FFFFFF" stroke="#C9D1D7" stroke-width="1.6"/><text x="98" y="898" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#26384B" text-anchor="start">ACTION</text><text x="98" y="923" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#26384B" text-anchor="start">Use the equilibrium-consistent reference bank</text>
<line x1="330" y1="940" x2="330" y2="958" stroke="#70849A" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="82" y="958" width="496" height="70" fill="#F7FAF9" stroke="#B7C8C3" stroke-width="1.5"/>
<text x="98" y="984" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#557663" text-anchor="start">VALIDATED OUTCOME</text>
<text x="98" y="1012" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#26384B" text-anchor="start">22 s · 2 cycles · RMSE 0.688 mm · max 1.021 mm</text>
<text x="654" y="512" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#26384B" text-anchor="start">T07  |  SHARED-MORPHOLOGY DESIGN</text>
<text x="654" y="538" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#70849A" text-anchor="start">Structure and control as distinct research questions</text>
<rect x="652" y="560" width="496" height="78" fill="#FFFFFF" stroke="#C9D1D7" stroke-width="1.6"/><text x="668" y="584" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#A35D55" text-anchor="start">OBSERVATION</text><text x="668" y="609" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#26384B" text-anchor="start">One morphology must satisfy four task conditions</text>
<line x1="900" y1="638" x2="900" y2="656" stroke="#70849A" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="652" y="656" width="496" height="78" fill="#FFFFFF" stroke="#C9D1D7" stroke-width="1.6"/><text x="668" y="680" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#B08A59" text-anchor="start">HYPOTHESIS</text><text x="668" y="705" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#26384B" text-anchor="start">Root geometry and tendon routing shape</text><text x="668" y="732" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">the shared task response.</text>
<line x1="900" y1="734" x2="900" y2="752" stroke="#70849A" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="652" y="752" width="496" height="104" fill="#F7FAF9" stroke="#B7C8C3" stroke-width="1.5"/>
<text x="670" y="778" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#527F7B" text-anchor="start">INVESTIGATION</text>
<text x="670" y="804" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#26384B" text-anchor="start">M1  |  Fixed input: (d0,U0) vs (d1,U0)</text>
<text x="670" y="832" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#26384B" text-anchor="start">M2  |  Re-optimized control: (d1,U1*)</text>
<line x1="900" y1="856" x2="900" y2="874" stroke="#70849A" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="652" y="874" width="496" height="66" fill="#FFFFFF" stroke="#C9D1D7" stroke-width="1.6"/><text x="668" y="898" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#26384B" text-anchor="start">ACTION</text><text x="668" y="923" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#26384B" text-anchor="start">Refine the root and route; adapt each control</text>
<line x1="900" y1="940" x2="900" y2="958" stroke="#70849A" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="652" y="958" width="496" height="70" fill="#F7FAF9" stroke="#B7C8C3" stroke-width="1.5"/>
<text x="668" y="984" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#557663" text-anchor="start">VALIDATED OUTCOME</text>
<text x="668" y="1012" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#26384B" text-anchor="start">One shared morphology · 4/4 task conditions</text>
<text x="1224" y="512" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#26384B" text-anchor="start">T10  |  IMPACT-RECOVERY CONTROL</text>
<text x="1224" y="538" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#70849A" text-anchor="start">Control-route adaptation on a fixed morphology</text>
<rect x="1222" y="560" width="496" height="78" fill="#FFFFFF" stroke="#C9D1D7" stroke-width="1.6"/><text x="1238" y="584" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#A35D55" text-anchor="start">OBSERVATION</text><text x="1238" y="609" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#26384B" text-anchor="start">GVS/NMPC trials retain recovery and</text><text x="1238" y="636" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">tendon-limit conflicts.</text>
<line x1="1470" y1="638" x2="1470" y2="656" stroke="#70849A" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="1222" y="656" width="496" height="78" fill="#FFFFFF" stroke="#C9D1D7" stroke-width="1.6"/><text x="1238" y="680" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#B08A59" text-anchor="start">HYPOTHESIS</text><text x="1238" y="705" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#26384B" text-anchor="start">The controller formulation is the bottleneck;</text><text x="1238" y="732" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">the morphology can remain unchanged.</text>
<line x1="1470" y1="734" x2="1470" y2="752" stroke="#70849A" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="1222" y="752" width="496" height="104" fill="#FFFFFF" stroke="#C9D1D7" stroke-width="1.6"/><text x="1238" y="776" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#527F7B" text-anchor="start">INVESTIGATION</text><text x="1238" y="801" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#26384B" text-anchor="start">Construct a native tangent model</text><text x="1238" y="828" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">Evaluate a discrete state-feedback formulation</text><text x="1238" y="851" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">with bounded tendon-tension allocation.</text>
<line x1="1470" y1="856" x2="1470" y2="874" stroke="#70849A" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="1222" y="874" width="496" height="66" fill="#FFFFFF" stroke="#C9D1D7" stroke-width="1.6"/><text x="1238" y="898" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#26384B" text-anchor="start">ACTION</text><text x="1238" y="923" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#26384B" text-anchor="start">Adopt discrete LQR and bounded allocation</text>
<line x1="1470" y1="940" x2="1470" y2="958" stroke="#70849A" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="1222" y="958" width="496" height="70" fill="#F7FAF9" stroke="#B7C8C3" stroke-width="1.5"/>
<text x="1238" y="984" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#557663" text-anchor="start">VALIDATED OUTCOME</text>
<text x="1238" y="1012" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#26384B" text-anchor="start">Common feedback recipe · 3/3 required impacts</text>
<text x="70" y="1090" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#929BA4" text-anchor="start">Main Agent decisions are reconstructed from archived research records; panels show the research process, not verbatim internal reasoning.</text>
