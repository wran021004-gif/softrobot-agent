<rect width="1800" height="1120" fill="#FFFFFF"/>
<text x="70" y="58" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#26384B" text-anchor="start">FIGURE 3  |  AGENT-DIRECTED RESEARCH PROCESS</text>
<text x="70" y="92" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#64717B" text-anchor="start">From physical observations to discriminating investigations and evidence-guided research actions</text>
<rect x="60" y="125" width="1680" height="240" fill="#FAFBFC" stroke="#D9DEE2" stroke-width="1.5"/>
<text x="88" y="158" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#70849A" text-anchor="start">COMMON RESEARCH LOOP</text>
<rect x="90" y="184" width="230" height="142" fill="#FFFFFF" stroke="#C9D1D7" stroke-width="1.6"/><text x="106" y="208" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#70849A" text-anchor="start">01</text><text x="106" y="233" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#26384B" text-anchor="start">Task and observation</text><text x="106" y="260" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">Frozen task contract</text><text x="106" y="283" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">Robot response / evidence</text>
<rect x="370" y="184" width="230" height="142" fill="#FFFFFF" stroke="#C9D1D7" stroke-width="1.6"/><text x="386" y="208" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#26384B" text-anchor="start">02</text><text x="386" y="233" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#26384B" text-anchor="start">Main Agent</text><text x="386" y="260" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">Physical hypothesis</text><text x="386" y="283" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">Research intent and next action</text>
<rect x="650" y="184" width="230" height="142" fill="#FFFFFF" stroke="#C9D1D7" stroke-width="1.6"/><text x="666" y="208" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#527F7B" text-anchor="start">03</text><text x="666" y="233" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#26384B" text-anchor="start">PPRP projection</text><text x="666" y="260" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">Task + candidate + parameters</text><text x="666" y="283" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">Observables + budget + semantics</text>
<rect x="930" y="184" width="230" height="142" fill="#FFFFFF" stroke="#C9D1D7" stroke-width="1.6"/><text x="946" y="208" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#527F7B" text-anchor="start">04</text><text x="946" y="233" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#26384B" text-anchor="start">Research tools</text><text x="946" y="260" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">One applicable M0–M3 view</text><text x="946" y="283" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">Math, control, or physical tools</text>
<rect x="1210" y="184" width="230" height="142" fill="#FFFFFF" stroke="#C9D1D7" stroke-width="1.6"/><text x="1226" y="208" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#70849A" text-anchor="start">05</text><text x="1226" y="233" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#26384B" text-anchor="start">Evidence</text><text x="1226" y="260" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">Validated mathematical facts</text><text x="1226" y="283" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">Independent physical outcomes</text>
<rect x="1490" y="184" width="220" height="142" fill="#FFFFFF" stroke="#C9D1D7" stroke-width="1.6"/><text x="1506" y="208" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#26384B" text-anchor="start">06</text><text x="1506" y="233" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#26384B" text-anchor="start">Next decision</text><text x="1506" y="260" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">Refine structure / control</text><text x="1506" y="283" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B5964" text-anchor="start">Or change research route</text>
<line x1="320" y1="255" x2="362" y2="255" stroke="#70849A" stroke-width="2.5" /><line x1="600" y1="255" x2="642" y2="255" stroke="#70849A" stroke-width="2.5" /><line x1="880" y1="255" x2="922" y2="255" stroke="#70849A" stroke-width="2.5" /><line x1="1160" y1="255" x2="1202" y2="255" stroke="#70849A" stroke-width="2.5" /><line x1="1440" y1="255" x2="1482" y2="255" stroke="#70849A" stroke-width="2.5" />
<path d="M 362 255 l -8 -6 v 12 z" fill="#70849A"/><path d="M 642 255 l -8 -6 v 12 z" fill="#70849A"/><path d="M 922 255 l -8 -6 v 12 z" fill="#70849A"/><path d="M 1202 255 l -8 -6 v 12 z" fill="#70849A"/><path d="M 1482 255 l -8 -6 v 12 z" fill="#70849A"/>
<text x="900" y="348" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#70849A" text-anchor="middle">M0–M3 are complementary analysis semantics; direct physical testing is also an available research action.</text>
<text x="70" y="418" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#26384B" text-anchor="start">REPRESENTATIVE RESEARCH TRAJECTORIES</text>
<text x="70" y="447" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#64717B" text-anchor="start">Each case shows how the Agent identifies a bottleneck, selects an investigation, and changes the subsequent research action.</text>
<rect x="60" y="475" width="540" height="575" fill="#FFFFFF" stroke="#C9D1D7" stroke-width="1.6"/>
<rect x="630" y="475" width="540" height="575" fill="#FFFFFF" stroke="#C9D1D7" stroke-width="1.6"/>
