# No credentials here. Read DEEPSEEK_API_KEY from the process environment only.
model: deepseek-flash
base_url: https://api.deepseek.com
thinking: enabled
# enabled preserves reasoning_content in complete tool exchanges; temperature is omitted.
# Compact only when the serialized request reaches this fraction of the byte cap.
context_compact_ratio: 0.85
temperature: 0.2
max_tokens: 8192
max_input_bytes: 100000
timeout_s: 90
model_calls: 12
model_failure_retries: 1
candidates: 3
simulations: 3
computation_retries: 0
tool_calls: 24
decisions: 24
tool_timeout_s: 180
