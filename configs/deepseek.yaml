# No credentials here. Read DEEPSEEK_API_KEY from the process environment only.
model: deepseek-flash
base_url: https://api.deepseek.com
thinking: disabled
# enabled preserves reasoning_content in complete tool exchanges; temperature is omitted.
# Start a fresh conversation from saved facts after this many complete exchanges.
context_turns: 2
temperature: 0.2
max_tokens: 2048
max_input_bytes: 60000
timeout_s: 90
model_calls: 18
model_failure_retries: 1
candidates: 3
simulations: 3
computation_retries: 0
tool_calls: 24
decisions: 24
tool_timeout_s: 180
