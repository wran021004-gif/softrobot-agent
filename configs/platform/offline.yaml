decisions:
- tool_id: analysis.vector_norm
  arguments:
    values_m:
    - 3.0
    - 4.0
  reason: Validate the new mathematical extension
- tool_id: evidence.read
  arguments:
    reference: $last_output
    pointer: /norm_m
  reason: Read actual mathematical output
- tool_id: simulation.run
  arguments: {}
  reason: Execute the development reference task
- tool_id: evaluation.run
  arguments:
    result: $last_output
  reason: Use the frozen evaluator
- tool_id: session.control
  arguments:
    status: stopped
    reason: Offline interface validation complete
  reason: Explicit stop
