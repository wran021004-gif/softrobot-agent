decisions:
- tool_id: analysis.force_peak
  arguments:
    values_n:
    - 1.0
    - -4.0
    - 3.0
  reason: Call the new tool
- tool_id: evidence.read
  arguments:
    reference: $last_output
    pointer: /peak_n
  reason: Read the newly saved peak value
- tool_id: session.control
  arguments:
    status: stopped
    reason: Exercise complete
  reason: End the offline exercise
