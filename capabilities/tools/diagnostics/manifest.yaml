  run_parameter_sensitivity:
    implementation_status: IMPLEMENTED
    implementation:
      module: tools.experiment_tools
      callable: run_parameter_sensitivity
    inputs: &id008
    - Human-owned ExperimentPolicy path
    - requested fidelity
    outputs:
    - RunArtifacts; sensitivity_evidence.json
    fields_consumed:
