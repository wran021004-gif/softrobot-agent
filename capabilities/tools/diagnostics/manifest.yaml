bundle_name: diagnostics
version: '2'
tools:
  compare_shape_model_sim:
    implementation_status: IMPLEMENTED
    implementation:
      module: tools.shape_tools
      callable: compare_shape_model_sim
    inputs: &id001
    - normal model_shape ToolResult
    - normal simulation ToolResult
    outputs:
    - ToolResult; tip/RMS/max discrepancies and 65 compact sample differences
    supported_robot_families:
    - tendon_driven_continuum
    fidelity: Geometric comparison of recorded PCC and segmented surrogate shapes
    assumptions:
    - Matching run and input hashes
    - constant matching C1 commands
    - normalized arc-length correspondence
    applicable_when: Completed M1 shape and final MuJoCo centerline.
    limitations:
    - No debug inputs
    - no approved mismatch threshold
    - failure_attribution remains UNKNOWN
    failure_codes:
    - UNKNOWN
    cost:
      compute: low; no MATLAB or MuJoCo launch
    fields_consumed:
    - model_shape.artifacts.centerline_m
    - simulation_result.artifacts.final_centerline_m
    - comparison_context
    - command evidence
    artifacts:
    - shape_comparison.json
    physics_contract_dependencies:
    - coordinate_frames.md
    - tendon_driven_pcc_v1.md
    - segmented_mujoco_mapping_v1.md
    gate_semantics: Evidence only; never automatic MODEL_MISMATCH or canonical override.
    category: evaluation_observation
    purpose: compare shape model sim; Geometric comparison of recorded PCC and segmented
      surrogate shapes
    version: round4_metadata_v1; implementation version remains source-bound
    states:
      implemented: true
      verified: REFERENCED_HISTORICAL_EVIDENCE
      calibrated: false
    units:
      geometry: m
      time: s
      angle: rad
      force: N
      torque: N m
      dimensionless: counts/status
    coordinate_frame: world_base_x_forward_yz_cross_section for geometric data; not
      applicable to registry/artifact operations
    time_semantics: Static geometry has no trajectory time; run_task post-integration
      state differs from last dynamics force/length arrays; see observation sampling
      metadata
    dependencies:
    - coordinate_frames.md
    - tendon_driven_pcc_v1.md
    - segmented_mujoco_mapping_v1.md
    - Python
    input_example:
      reference: examples/run_reach_pipeline.py / tests/test_architecture.py
      inputs: *id001
      note: Use typed inputs listed above; planned operations have no executable input
    evidence_refs:
    - docs/round3_deterministic_closeout_result.md
    - docs/round3_closeout_validation.md
  compare_model_sim:
    implementation_status: IMPLEMENTED
    implementation:
      module: tools.diagnostic_tools
      callable: compare_model_sim
    inputs: &id002
    - 'model_result: ToolResult'
    - 'simulation_result: ToolResult'
    - 'task: TaskSpec'
    - 'evidence_paths: optional caller-supplied references'
    outputs:
    - ToolResult; evidence_status available/unavailable; failure_attribution UNKNOWN;
      measured evidence
    supported_robot_families:
    - tendon_driven_continuum
    fidelity: Deterministic evidence arithmetic on recorded V1 observations; no validated
      physical or causal inference.
    assumptions:
    - Trusted Harness same-run artifacts; callers must verify recorded artifact hashes
      before reading persisted evidence.
    - No approved model mismatch, tracking acceptance, or large-qvel thresholds.
    applicable_when: V1 structured execution evidence is available; task failure does
      not prevent diagnostics.
    limitations:
    - Missing/malformed evidence returns unavailable and UNKNOWN.
    - Reaching the upper 0 N no-push bound is distinct from lower-bound maximum pulling
      force; neither establishes cable slack.
    - No canonical gate changes, optimizer, physical stability certificate, or causal
      attribution.
    failure_codes:
    - UNKNOWN
    cost:
      compute: low
      note: O(tendon/actuator/state summary size), no simulator or MATLAB launch.
    fields_consumed:
    - model_result.metrics.predicted_tip_m / predicted_position_error_m / model_task_success
      / target_position_m / tendon_target_lengths_m
    - simulation_result.metrics.tip_position_m / position_error_m / task_success /
      position_error_max_m / target_position_m / tendon_target_lengths_m
    - both metrics.comparison_context (Harness run/input hashes and coordinate frame)
    - TaskSpec.target_m / position_error_max_m
    - execution_evidence.actuators command extrema and active sample counts
    artifacts:
    - compare_model_sim.json (Harness artifact service)
    - diagnostic_summary.json (Harness aggregate)
    physics_contract_dependencies:
    - coordinate_frames.md
    - actuator_model_v1.md
    - tendon_length_mapping_v1.md
    category: evaluation_observation
    purpose: compare model sim; Deterministic evidence arithmetic on recorded V1 observations;
      no validated physical or causal inference.
    version: round4_metadata_v1; implementation version remains source-bound
    states:
      implemented: true
      verified: REFERENCED_HISTORICAL_EVIDENCE
      calibrated: false
    units:
      geometry: m
      time: s
      angle: rad
      force: N
      torque: N m
      dimensionless: counts/status
    coordinate_frame: world_base_x_forward_yz_cross_section for geometric data; not
      applicable to registry/artifact operations
    time_semantics: Static geometry has no trajectory time; run_task post-integration
