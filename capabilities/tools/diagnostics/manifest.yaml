  check_collision:
    implementation_status: IMPLEMENTED
    implementation:
      module: tools.diagnostic_tools
      callable: check_collision
    inputs: &id006
    - clearance ToolResult
    - simulation ToolResult
    - optional evidence_paths
    outputs:
    - ToolResult with geometric prediction
    - actual contact
    - disagreement evidence and UNKNOWN causal attribution
    supported_robot_families: *id005
    fidelity: Deterministic arithmetic over low/geometric PCC and sampled MuJoCo surrogate
      evidence.
    assumptions:
    - Matching Harness comparison_context and completed execution
    applicable_when: Constrained reach execution with clearance and window evidence.
    limitations:
    - Missing evidence yields unavailable and UNKNOWN; numerical termination uses
      existing inspect_numerics.
    - Prediction disagreement and contact are observations, not causal proof or validated
      physics.
    - No contact in discrete samples does not guarantee continuous collision avoidance.
    failure_codes:
    - UNKNOWN
    cost:
      compute: low
    fields_consumed:
    - clearance_result.metrics
    - simulation_result.metrics.window_evidence
    - comparison_context
    - target_reached
