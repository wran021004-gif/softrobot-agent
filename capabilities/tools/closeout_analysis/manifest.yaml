tools:
  closeout_mechanics_solve:
    implementation_status: IMPLEMENTED
    implementation:
      module: tools.mechanics_tools
      callable: MechanicsTools.solve
    inputs: &id001
    - AnalysisSpec
    - live MatlabTools
    - persistent solve ledger
    outputs:
    - actual equilibrium/dynamic/fit result or structured failure
    supported_robot_families:
    - tendon_driven_continuum
    fidelity: independent planar one-mode surrogate analysis
    assumptions:
    - compiled V1 parameters; no calibration
    - given nonnegative tension; no implicit length-to-tension mapping
    applicable_when: Exact closeout authorization, valid planar AnalysisSpec and MATLAB
      backend
    limitations:
    - No contact, catch task, out-of-plane mechanics or true-robot claim
    - No main experiment physics writeback
    failure_codes:
    - CAPABILITY_MISSING
    - PHYSICS_ASSUMPTION_REQUIRED
    - UNKNOWN
    cost:
      compute: static <=160 objective evaluations; dynamics <=4 seconds horizon and
        30 seconds wall time
    fields_consumed:
    - AnalysisSpec SI fields
    - RobotIR
    - compiled mass/inertial frame/stiffness/damping
    artifacts:
    - caller saved parameter/result JSON
    - persistent mechanics solve ledger
    physics_contract_dependencies:
    - closeout_analysis_v1.md
    authorization_source: configs/experiments/round3_closeout_authorization.yaml
    category: mathematical_analysis
    purpose: closeout mechanics solve; independent planar one-mode surrogate analysis
    version: round4_metadata_v1; implementation version remains source-bound
    states:
      implemented: true
      verified: REFERENCED_HISTORICAL_EVIDENCE
      calibrated: false
    units:
      geometry: m
      time: s
      angle: rad
      force: N
      torque: N m
      dimensionless: counts/status
    coordinate_frame: world_base_x_forward_yz_cross_section for geometric data; not
      applicable to registry/artifact operations
    time_semantics: Static geometry has no trajectory time; run_task post-integration
      state differs from last dynamics force/length arrays; see observation sampling
      metadata
    dependencies:
    - closeout_analysis_v1.md
    - Python
    input_example:
      reference: examples/run_reach_pipeline.py / tests/test_architecture.py
      inputs: *id001
      note: Use typed inputs listed above; planned operations have no executable input
    evidence_refs:
    - docs/round3_deterministic_closeout_result.md
    - docs/round3_closeout_validation.md
