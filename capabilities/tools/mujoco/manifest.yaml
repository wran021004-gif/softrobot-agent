bundle_name: mujoco
version: '1'
tools:
  compile_mujoco:
    implementation:
      module: tools.mujoco_tools
      callable: compile_mujoco
    supported_robot_families:
    - tendon_driven_continuum
    family_support: partial
    inputs:
      robot_ir: RobotIR (DesignSpec compatibility accepted)
      task: TaskSpec
      output_path: Path
      environment: EnvironmentSpec
      simulator: SimulatorSpec
    output: ToolResult
    design_fields_used:
    - robot_family
    - sections
    - segments
    - total_length_m
    - body_radius_m
    - tendon_count
    - tendon_routing_radius_m
    discriminator_field: robot_family
    configuration_constraints:
      sections: 1
    numerical_design_fields_used:
    - segments
    - total_length_m
    - body_radius_m
    - tendon_count
    - tendon_routing_radius_m
    currently_ignored_design_fields: []
    task_fields_used:
    - environment_id
    - target_m
    currently_ignored_task_fields:
    - task_id
    - task_type
    - position_error_max_m
    fidelity:
      level: low
      model: single_section_tendon_actuated_segmented_approximation
    contract:
      robot_base_m:
      - 0.0
      - 0.0
      - 0.0
      segment_length: total_length_m / segments
      segment_direction: local +x
      joint_axes:
      - local +y
      - local +z
      environment_source: tasks/<environment_id>/environment.yaml; validated tasks/<environment_id>/mujoco.xml
        representation
      floor_z: Fixed by environment; reach_free uses -0.02 m independent of design.
      tendon_routing: N spatial paths through base and each segment distal end.
      routing_offset_yz: r_t * [cos(2*pi*i/N), sin(2*pi*i/N)]
      physical_spatial_tendon_routing: implemented
      tendon_transmission_actuator: implemented
      actuator_control: Target tendon length in meters, unit gear, ordered tendon_0
        through tendon_N-1.
      tip_site: Last segment at local [segment_length, 0, 0].
      target_site: World site at task.target_m; no collision or actuation.
      pass_condition: MJCF written; loading and task success are checked separately.
      metrics: {}
      artifacts:
        mjcf_path: Absolute path to generated XML.
    limitations:
    - Single-section low fidelity segmented surrogate; not Cosserat/FEM or validated
      material physics.
    - Arm self-contact disabled; no extension/torsion.
    - File-write exceptions propagate; harness records errors.
    - Reserved environment components are not executable.
    failure_codes:
      UNSUPPORTED_ROBOT_FAMILY: Only tendon_driven_continuum is accepted.
      UNSUPPORTED_DESIGN_CONFIGURATION: Only sections=1 is accepted.
      INVALID_DESIGN: Counts and dimensions must be positive and finite.
      INVALID_ENVIRONMENT: Invalid ID, missing/unreadable XML, malformed XML, or missing
        mujoco/worldbody.
      PHYSICS_ASSUMPTION_REQUIRED: Unapproved/missing IR physics contract (raised
        ValueError).
    cost:
      compute: low
    fields_consumed:
    - RobotIR.section
    - RobotIR.tendon_routes
    - RobotIR.mechanics
    - EnvironmentSpec.objects
    - EnvironmentSpec.lights
    - EnvironmentSpec.gravity_m_s2
    - SimulatorSpec.timestep_s
    - TaskSpec.target_m
    artifacts:
    - robot.xml
    - compile_result.json
    physics_contract_dependencies: &id001
    - coordinate_frames.md
    - tendon_driven_pcc_v1.md
    - tendon_length_mapping_v1.md
    - segmented_mujoco_mapping_v1.md
    - actuator_model_v1.md
    assumptions:
    - Approved legacy_v1_surrogate mechanics; target/tolerance owned by task.
    applicable_when: V1 reach task and supported environment; final task decision
      uses actual MuJoCo tip.
    implementation_status: IMPLEMENTED
    outputs:
    - ToolResult
    exception_policy: Schema/IR/contract validation exceptions propagate; Harness
      records stage and message.
  validate_task:
    implementation:
      module: tools.mujoco_tools
      callable: validate_task
    supported_robot_families:
    - tendon_driven_continuum
    family_support: partial
    family_check: No DesignSpec input or runtime family check; intended for this bundle's
      compiled MJCF.
    inputs:
      xml_path: str | pathlib.Path
      task: TaskSpec
      tendon_target_lengths_m: Optional list[float], default None.
    output: ToolResult
    design_fields_used: []
    currently_ignored_design_fields: []
    design_input_note: No DesignSpec argument; geometry and dynamics are read from
      MJCF.
    task_fields_used:
    - target_m
    - position_error_max_m
    currently_ignored_task_fields:
    - task_id
    - task_type
    - environment_id
    fidelity:
      level: low
      model: final_position_gate_on_tendon_actuated_segmented_simulation
    contract:
      steps: 1000
      steps_source: configs/run.yaml
      control: Compatibility wrapper builds open_loop_length and delegates to run_task.
      command_validation: Length count equals model.nu and model.ntendon; ordered
        tendon transmissions required.
      no_command: Disable actuation explicitly for unactuated simulation; zero ctrl
        would request zero length.
      finite_checks:
      - qpos_each_step
      - qvel_each_step
      - final_tip_position
      tip_position_source: data.site_xpos at tip_site after final mj_forward
      target_source: task.target_m; target_site is not read
      coordinate_frame: MuJoCo world, equal to compiled robot base frame
      position_error_m: Euclidean distance between final tip position and task.target_m
      task_success: position_error_m <= task.position_error_max_m
      pass_condition: Simulation checks pass and task_success is true.
      metrics_on_completed_simulation:
        steps: int
        nq: int
        nv: int
        tip_position_m: list[float]
        target_position_m: list[float]
        position_error_m: float
        position_error_max_m: float
        task_success: bool
      additional_metrics_with_command:
        tendon_target_lengths_m: list[float]
        final_tendon_lengths_m: list[float]
        actuator_controls: list[float]
        actuator_force: list[float]
      artifacts: []
    limitations:
    - Final position only; minimal finite-state sanity, no robustness guarantee.
    - Legacy wrapper; unknown task types are rejected.
    failure_codes:
      TASK_FAILED: Simulation completed but final position error exceeds the allowed
        error.
      PHYSICS_ERROR: Exception during model loading, site lookup, simulation, or evaluation.
      NONFINITE_STATE: A checked state or final tip position contains NaN or Inf.
      INVALID_TENDON_COMMAND: Invalid length count/values or model transmission/order;
        retains available execution evidence.
      CAPABILITY_MISSING: No implemented route/evaluator for requested task.
    cost:
      compute: low
      note: Fixed 1000 steps; actual cost depends on the input XML.
    fields_consumed:
    - MJCF
    - TaskSpec.target_m
    - TaskSpec.position_error_max_m
    - tendon_target_lengths_m
    - RunSettings.steps
    artifacts:
    - ToolResult (caller persists)
    physics_contract_dependencies: *id001
    assumptions:
    - Approved legacy_v1_surrogate mechanics; target/tolerance owned by task.
    applicable_when: V1 reach task and supported environment; final task decision
      uses actual MuJoCo tip.
    implementation_status: IMPLEMENTED
    outputs:
    - ToolResult
    exception_policy: Schema/IR/contract validation exceptions propagate; Harness
      records stage and message.
  run_task:
    implementation:
      module: tools.mujoco_tools
      callable: run_task
    inputs:
      xml_path: Path
      task: TaskSpec
      controller: Controller protocol or None
      run_settings: RunSettings
      environment: EnvironmentSpec required for reach_window; optional for legacy reach
      evaluator: Optional resolved TaskContract evaluator callable; legacy default evaluate_reach
    gate_semantics: Executable finite-state evidence is HARD; actual task acceptance is CANONICAL for the selected task, without promoting development fixtures to frozen benchmarks.
    outputs:
    - ToolResult with canonical actual metrics, compact execution_evidence, resolved
      engine parameter provenance and final state
    fields_consumed:
    - MJCF
    - TaskSpec.task_type
    - TaskSpec.target_m
    - TaskSpec.position_error_max_m
    - ControlCommand.tendon_target_lengths_m
    - RunSettings.steps
    - EnvironmentSpec window geometry and frame (reach_window)
    fidelity:
      level: low
      model: segmented surrogate + canonical reach evaluator
    limitations:
    - Reach and single axis-aligned reach_window evaluators only; window development fixture is not a frozen benchmark.
    - Window evidence records sampled capsule-to-frame distances, contact points/counts, initial configuration and final aperture crossing; floor excluded.
    - reach_window success requires target tolerance AND required initial whole-body side AND final aperture crossing AND no forbidden sampled window contact; no continuous collision guarantee.
    - TaskSpec.acceptance supports before_window or unrestricted initial region; legacy development default unrestricted is not formal approval. No new initial-state generator.
    - Finite state is not validated physical fidelity.
    - No automatic tuning or retry.
    - Step force/length samples are solver-stage values; qpos/qvel are post-integration.
      No extra forward calls in integration loop. An upper zero-bound hit does not prove
      active clipping or maximum-pull saturation.
    failure_codes:
    - TASK_FAILED
    - PHYSICS_ERROR
    - NONFINITE_STATE
    - INVALID_TENDON_COMMAND
    - CONTROL_FAILURE
    - CAPABILITY_MISSING
    artifacts:
    - mujoco_result.json
    - metrics.json
    - simulation_state.json
    physics_contract_dependencies: *id001
    assumptions:
    - Approved legacy_v1_surrogate mechanics; target/tolerance owned by task.
    applicable_when: V1 reach task and supported environment; final task decision
      uses actual MuJoCo tip.
    implementation_status: IMPLEMENTED
    supported_robot_families: &id002
    - tendon_driven_continuum
    cost:
      compute: low
      note: MATLAB startup separate; MuJoCo cost scales with discretization and steps.
    exception_policy: Schema/IR/contract validation exceptions propagate; Harness
      records stage and message.
  validate_physics:
    implementation_status: PLANNED
    inputs:
    - RobotIR
    - MJCF
    - approved reference evidence
    outputs:
    - physics validation report
    supported_robot_families: *id002
    fidelity: unimplemented; no numerical claims
    assumptions:
    - Requires Human-approved scientific semantics before implementation.
    applicable_when: Roadmap only; resolver returns IMPLEMENTATION_REQUIRED.
    limitations:
    - No callable and no fabricated results.
    failure_codes:
    - CAPABILITY_MISSING
    - PHYSICS_ASSUMPTION_REQUIRED
    cost:
      compute: unknown until implemented
    fields_consumed: []
    artifacts: []
    physics_contract_dependencies: []
    contract_status: PLANNED; consumed fields, artifact formats and physics dependencies
      require approval before promotion
  evaluate_metrics:
    implementation_status: PLANNED
    inputs:
    - task metric definitions
    - trajectory
    outputs:
    - extended canonical metrics
    supported_robot_families: *id002
    fidelity: unimplemented; no numerical claims
    assumptions:
    - Requires Human-approved scientific semantics before implementation.
    applicable_when: Roadmap only; resolver returns IMPLEMENTATION_REQUIRED.
    limitations:
    - No callable and no fabricated results.
    failure_codes:
    - CAPABILITY_MISSING
    - PHYSICS_ASSUMPTION_REQUIRED
    cost:
      compute: unknown until implemented
    fields_consumed: []
    artifacts: []
    physics_contract_dependencies: []
    contract_status: PLANNED; consumed fields, artifact formats and physics dependencies
      require approval before promotion
