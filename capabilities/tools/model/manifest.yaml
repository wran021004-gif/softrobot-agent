  analyze_clearance:
    implementation_status: IMPLEMENTED
    gate_semantics: Completed geometric prediction is SCREENING; a tool execution
      failure is distinct and HARD.
    implementation:
      module: tools.matlab_tools
      callable: MatlabTools.analyze_clearance
      backend: matlab/analyze_clearance.m
    inputs: &id003
    - RobotIR
    - TaskSpec
    - EnvironmentSpec
    - PCC ToolResult
    outputs:
    - ToolResult with conservative minimum clearance
    - intersection
    - closest sample/segment/bar
    - aperture crossing and centreline
    supported_robot_families: &id004
    - tendon_driven_continuum
    fidelity:
      level: low
      model: geometric_PCC_swept_radius
    assumptions:
    - Single-section PCC, fixed world origin, exactly one y-z window normal to +x.
    - Window box centres/half sizes are passed from the shared EnvironmentSpec parser.
    applicable_when: Completed M1 plan for reach_window, including NON_CANONICAL development
      fixtures.
    limitations:
    - PCC shape approximation; no gravity, dynamics, floor, actuation feasibility
      or validated physical collision prediction.
    - Minimum is a conservative lower bound using half the arc sample spacing; a negative
      bound alone is not proof of intersection.
    - Closest sample/segment identifies the sampled minimum, not an exact continuous
      minimizer.
    - Tool pass means analysis completed, not clearance or task success.
    failure_codes:
    - CAPABILITY_MISSING
    - PHYSICS_ASSUMPTION_REQUIRED
    exception_policy: Input or MATLAB failures propagate to the existing Harness.
    cost:
      compute: low
      note: Linear in PCC sample count and four window bars; MATLAB session reused.
    fields_consumed:
    - RobotIR.section.length_m / body_radius_m / segments / coordinate_frame
    - TaskSpec.task_type / target_m / environment_id
    - EnvironmentSpec.window dimensions, position and plane
    - model_result theta_rad / phi_rad / comparison_context
    artifacts:
    - clearance_result.json
    physics_contract_dependencies:
    - coordinate_frames.md
    - tendon_driven_pcc_v1.md
    equations: Sample PCC centreline; min signed point-box distance - body radius
      - half arc spacing; shared window_boxes and aperture_crossing; see matlab/analyze_clearance.m
      and tools/window_geometry.py.
    category: mathematical_analysis
    purpose: 'analyze clearance; {''level'': ''low'', ''model'': ''geometric_PCC_swept_radius''}'
    version: round4_metadata_v1; implementation version remains source-bound
    states:
