bundle_name: workbench
version: '1'
tools:
  query_tools:
    implementation_status: IMPLEMENTED
    category: capability_management
    implementation:
      module: capabilities.registry
      callable: query_tools
    purpose: Query executable and missing tools without numerical imports
    inputs: &id001
    - category
    outputs:
    - structured result or observation object; exceptions for invalid contracts
    input_example:
      category: mathematical_analysis
    assumptions:
    - saved-data provenance or valid scoped inputs required
    limitations:
    - No hardware, LLM, calibration or operating-system isolation
    applicable_when: Valid inputs and dependencies; task failure is not missing capability
    failure_codes:
    - INVALID_INPUT
    - EVIDENCE_INCOMPLETE
    - IMPLEMENTATION_REQUIRED
    dependencies:
    - Python
    cost:
      backend_calls: 0
    artifacts:
    - docs/evidence/round4
    supported_robot_families:
    - tendon_driven_continuum
    version: round4_metadata_v1; implementation version remains source-bound
    states:
      implemented: true
      verified: FOCUSED_CONTRACT_CHECKS; execution scope and numeric evidence in docs/round4_result.md
      calibrated: false
    units:
      geometry: m
      time: s
      angle: rad
      force: N
      torque: N m
      dimensionless: counts/status
    coordinate_frame: world_base_x_forward_yz_cross_section for geometry; N/A for
      metadata operations
    time_semantics: Static geometry has no trajectory time; run_task post-integration
      state differs from last dynamics force/length arrays; consult observation metadata
    evidence_refs:
    - docs/round4_result.md
    - docs/evidence/round4/test_record.json
    - docs/evidence/round4/audit.json
    fidelity: saved-data observation or scoped independent development; see purpose
    fields_consumed: *id001
    physics_contract_dependencies: []
