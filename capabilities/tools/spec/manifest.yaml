bundle_name: spec
version: '1'
tools:
  load_task:
    implementation:
      module: tools.spec_tools
      callable: load_task
    inputs: &id001
    - task package path
    outputs:
    - TaskSpec
    fields_consumed:
    - task.yaml
    failure_codes:
    - INVALID_SPEC
    fidelity: structural
    assumptions:
    - Human-owned input semantics are authoritative.
    applicable_when: Deterministic V1 harness; schema validation alone does not imply
      route support.
    limitations:
    - No physical success claim; validation exceptions propagate to the harness.
    physics_contract_dependencies: []
    artifacts: []
    implementation_status: IMPLEMENTED
    supported_robot_families: &id002
    - tendon_driven_continuum
    cost:
      compute: low
      note: MATLAB startup separate; MuJoCo cost scales with discretization and steps.
    category: design_compile
    purpose: load task; structural
    version: round4_metadata_v1; implementation version remains source-bound
    states:
      implemented: true
      verified: REFERENCED_HISTORICAL_EVIDENCE
      calibrated: false
    units:
      geometry: m
      time: s
      angle: rad
      force: N
      torque: N m
      dimensionless: counts/status
    coordinate_frame: world_base_x_forward_yz_cross_section for geometry; N/A for
      metadata operations
    time_semantics: Static geometry has no trajectory time; run_task post-integration
      state differs from last dynamics force/length arrays; consult observation metadata
    dependencies:
    - Python
    input_example:
      reference: examples/run_reach_pipeline.py / tests/test_architecture.py
      inputs: *id001
      note: Typed object construction shown in referenced executable examples
    evidence_refs:
    - docs/round3_deterministic_closeout_result.md
    - docs/round3_closeout_validation.md
