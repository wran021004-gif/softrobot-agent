bundle_name: control
version: '1'
tools:
  plan_open_loop:
    implementation:
      module: controllers.open_loop_length
      callable: plan_open_loop
    inputs: &id001
    - positive finite tendon lengths
    outputs:
    - ControllerResult
    fields_consumed:
    - tendon_target_lengths_m
    failure_codes:
    - INVALID_TENDON_COMMAND
    fidelity: C1 open loop
    assumptions:
    - Human-owned input semantics are authoritative.
    applicable_when: Deterministic V1 harness; schema validation alone does not imply
      route support.
    limitations:
    - No physical success claim; validation exceptions propagate to the harness.
    physics_contract_dependencies: []
    artifacts:
    - controller.json
    - tendon_command.json
    implementation_status: IMPLEMENTED
    supported_robot_families: &id003
    - tendon_driven_continuum
    cost:
      compute: low
      note: MATLAB startup separate; MuJoCo cost scales with discretization and steps.
    category: design_control_generation
    purpose: plan open loop; C1 open loop
    version: round4_metadata_v1; implementation version remains source-bound
    states:
      implemented: true
      verified: REFERENCED_HISTORICAL_EVIDENCE
      calibrated: false
    units:
      geometry: m
      time: s
      angle: rad
      force: N
      torque: N m
      dimensionless: counts/status
    coordinate_frame: world_base_x_forward_yz_cross_section for geometric data; not
      applicable to registry/artifact operations
    time_semantics: Static geometry has no trajectory time; run_task post-integration
      state differs from last dynamics force/length arrays; see observation sampling
      metadata
    dependencies:
    - Python
    input_example:
      reference: examples/run_reach_pipeline.py / tests/test_architecture.py
      inputs: *id001
      note: Use typed inputs listed above; planned operations have no executable input
    evidence_refs:
    - docs/round3_deterministic_closeout_result.md
    - docs/round3_closeout_validation.md
  synthesize_feedback:
    implementation_status: IMPLEMENTED
    implementation:
      module: controllers.pcc_tip_feedback
      callable: synthesize_feedback
    inputs: &id002
    - RobotIR
    - TaskSpec
    - M1 ToolResult
    - ValidatedExperiment
    outputs:
    - PCCTipFeedback Controller
    fields_consumed:
    - RobotIR.section.length_m
    - RobotIR.tendon_routes.angle_rad
    - RobotIR.tendon_routing_radius_m
    - TaskSpec.target_m
    - ExperimentPolicy.feedback_parameters
    - MuJoCo observed tip_position_m and integer step
    artifacts:
    - feedback_controller.json
    - feedback_updates.json
    - controller.json
    fidelity: C2 actual tip feedback; legacy C1 open loop unchanged
    supported_robot_families:
    - tendon_driven_continuum
    physics_contract_dependencies:
    - tendon_driven_pcc_v1.md
    - tendon_length_mapping_v1.md
    - coordinate_frames.md
    assumptions:
    - Single-section approved PCC geometry only; no new mechanical law or tuned defaults.
    - Numerical experiments require file-owned policy and approved grammar; TEST_ONLY
      cannot execute frozen tasks.
    applicable_when: Explicit supported route and numerical authorization; real experiments
      currently blocked pending Human approval.
    limitations:
    - No real robot validation, convergence guarantee or causal attribution.
    - No canonical success from model predictions; no TaskContract or Skill mutation.
    failure_codes:
    - PHYSICS_ASSUMPTION_REQUIRED
    - CAPABILITY_MISSING
    - UNKNOWN
    cost:
      compute: bounded by explicit policy budgets
    gate_semantics: HARD input/execution legality; SCREENING model evidence; existing
      MUJOCO evaluator alone is CANONICAL
    category: design_control_generation
    purpose: synthesize feedback; C2 actual tip feedback; legacy C1 open loop unchanged
    version: round4_metadata_v1; implementation version remains source-bound
    states:
      implemented: true
      verified: REFERENCED_HISTORICAL_EVIDENCE
      calibrated: false
    units:
      geometry: m
      time: s
      angle: rad
      force: N
      torque: N m
      dimensionless: counts/status
    coordinate_frame: world_base_x_forward_yz_cross_section for geometric data; not
      applicable to registry/artifact operations
    time_semantics: Static geometry has no trajectory time; run_task post-integration
      state differs from last dynamics force/length arrays; see observation sampling
      metadata
    dependencies:
    - tendon_driven_pcc_v1.md
    - tendon_length_mapping_v1.md
    - coordinate_frames.md
    - Python
    input_example:
      reference: examples/run_reach_pipeline.py / tests/test_architecture.py
      inputs: *id002
      note: Use typed inputs listed above; planned operations have no executable input
    evidence_refs:
    - docs/round3_deterministic_closeout_result.md
    - docs/round3_closeout_validation.md
  synthesize_model_controller:
    implementation_status: PLANNED
    inputs:
    - approved dynamic model
    - task
    outputs:
    - ControlSpec
    supported_robot_families: *id003
    fidelity: unimplemented; no numerical claims
    assumptions:
    - Requires Human-approved scientific semantics before implementation.
    applicable_when: Roadmap only; resolver returns IMPLEMENTATION_REQUIRED.
    limitations:
    - No callable and no fabricated results.
    failure_codes:
    - CAPABILITY_MISSING
    - PHYSICS_ASSUMPTION_REQUIRED
    cost:
      compute: unknown until implemented
    fields_consumed: []
    artifacts: []
    physics_contract_dependencies: []
    contract_status: PLANNED; consumed fields, artifact formats and physics dependencies
      require approval before promotion
    category: design_control_generation
    purpose: synthesize model controller; unimplemented; no numerical claims
    version: round4_metadata_v1; implementation version remains source-bound
    states:
      implemented: false
      verified: NOT_IMPLEMENTED
      calibrated: false
    units:
      geometry: m
      time: s
      angle: rad
      force: N
      torque: N m
      dimensionless: counts/status
    coordinate_frame: world_base_x_forward_yz_cross_section for geometric data; not
      applicable to registry/artifact operations
    time_semantics: Static geometry has no trajectory time; run_task post-integration
      state differs from last dynamics force/length arrays; see observation sampling
      metadata
    dependencies:
    - Python
    input_example:
      status: NOT_IMPLEMENTED
      legal_executable_input: null
    evidence_refs: []
  optimize_controller:
    implementation_status: PLANNED
    inputs:
    - ControlSpec
    - objective
    - approved bounds
    outputs:
    - ControlSpec
    - evidence
    supported_robot_families: *id003
    fidelity: unimplemented; no numerical claims
    assumptions:
    - Requires Human-approved scientific semantics before implementation.
    applicable_when: Roadmap only; resolver returns IMPLEMENTATION_REQUIRED.
    limitations:
    - No callable and no fabricated results.
    failure_codes:
    - CAPABILITY_MISSING
    - PHYSICS_ASSUMPTION_REQUIRED
    cost:
      compute: unknown until implemented
    fields_consumed: []
    artifacts: []
    physics_contract_dependencies: []
    contract_status: PLANNED; consumed fields, artifact formats and physics dependencies
      require approval before promotion
    category: design_control_generation
    purpose: optimize controller; unimplemented; no numerical claims
    version: round4_metadata_v1; implementation version remains source-bound
    states:
      implemented: false
      verified: NOT_IMPLEMENTED
      calibrated: false
    units:
      geometry: m
      time: s
      angle: rad
      force: N
      torque: N m
      dimensionless: counts/status
    coordinate_frame: world_base_x_forward_yz_cross_section for geometric data; not
      applicable to registry/artifact operations
    time_semantics: Static geometry has no trajectory time; run_task post-integration
      state differs from last dynamics force/length arrays; see observation sampling
      metadata
    dependencies:
    - Python
    input_example:
      status: NOT_IMPLEMENTED
      legal_executable_input: null
    evidence_refs: []
