family_name: tendon_driven_continuum
schema: DesignSpec
schema_module: schemas.design_spec
implementation_status: partial
design_fields:
  robot_family:
    type: str
    meaning: Robot family identifier accepted by the current analysis and compiler.
    role: discriminator
    implementation_status: active
    allowed_values: [tendon_driven_continuum]
    example_value: tendon_driven_continuum
  sections:
    type: int
    meaning: Intended number of continuum sections; currently ignored by execution tools.
    role: morphology
    implementation_status: reserved
    example_value: 1
  segments:
    type: int
    meaning: Number of equal capsule bodies in the passive MuJoCo chain.
    role: discretization
    implementation_status: active
    example_value: 8
  total_length_m:
    type: float
    meaning: Geometric reach bound and sum of segment centerline lengths.
    unit: m
    role: morphology
    implementation_status: active
    example_value: 0.40
  body_radius_m:
    type: float
    meaning: Uniform capsule radius; also determines the floor offset.
    unit: m
    role: morphology
    implementation_status: active
    example_value: 0.02
  tendon_count:
    type: int
    meaning: Intended tendon count; no tendons are currently generated.
    role: actuation_description
    implementation_status: reserved
    example_value: 4
  tendon_routing_radius_m:
    type: float
    meaning: Intended tendon routing radius; currently has no physical effect.
    unit: m
    role: actuation_description
    implementation_status: reserved
    example_value: 0.015
generation_guidance:
  - Emit the existing flat DesignSpec fields only.
  - Keep reserved fields at their example values until corresponding tools support them.
  - Segments must be positive; length and radius must be positive for meaningful model generation.
  - These requirements are guidance; DesignSpec currently provides type checks, not physical range validation.
  - Example values are from configs/design_tendon_arm.yaml, not validated scientific operating ranges.
tool_coverage_source: Tool manifests declare consumed and ignored fields; no duplicate coverage matrix is maintained here.
unsupported_capabilities:
  - multi_section_physics
  - tapered_radius
  - variable_stiffness
  - physical_tendon_routing
  - tendon_actuation
  - interchangeable_end_effector
